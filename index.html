<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAEL</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>KAEL</h1>

        <p class="status">
            ASSISTANT EN LIGNE
        </p>

        <div class="circle">
            KAEL
        </div>

        <div id="chat">
            <p>
                <strong>KAEL :</strong>
                Bonjour. Je suis prêt.
            </p>
        </div>

        <div class="controls">

            <input
                type="text"
                id="message"
                placeholder="Écris un message..."
            >

            <button onclick="sendMessage()">
                ENVOYER
            </button>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
